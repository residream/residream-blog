location = /data/public-stats.json {
    alias /var/lib/residream-public-stats/public-stats.json;
    expires 10m;
}

location = /data/github-contributions.svg {
    alias /var/lib/residream-public-stats/github-contributions.svg;
    expires 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
}

location = /data/public-refresh.json {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8791;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 25s;
    proxy_cache off;
}
